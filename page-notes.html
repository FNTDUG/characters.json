<template data-page-note="fntd2-boss-raids-omc-tips">
<div style="margin-top:18px;text-align:center">
          <p style="font-family:'Audiowide',sans-serif;font-size:20px;color:var(--ug-accent);margin-bottom:8px">Tips for <span style="color:#9a1e1e">OMC:</span></p>
          <p style="font-size:16px;color:#fff;line-height:1.75;max-width:680px;margin:0 auto 10px">If you haven't unlocked the "???" modifier, you can get it by getting 1.5x Difficulty or, unlock the OMC quests by beating wave 100 with someone who has the modifier (Note: They must host the Boss Raids match).</p>
          <p style="font-size:16px;color:#fff;line-height:1.75;max-width:680px;margin:0 auto">You can bypass the "Obtain Time Lord Withered Freddy" quest by trading or index trading for him. He does not need to stay in your inventory, only indexed (Note: if you buy him from the market it will not complete until you trade it back to yourself).</p>
        </div>
</template>
